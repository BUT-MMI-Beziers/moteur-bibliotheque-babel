name: Publication

# À chaque push sur main, release-please tient à jour une PR de release (version + CHANGELOG)
# à partir des commits conventionnels (feat:, fix:, ...). Merger cette PR crée le tag vX.Y.Z
# et la Release GitHub ; Packagist lit le tag : `composer require` voit la nouvelle version.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Version et CHANGELOG
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # Explicite : sinon release-please vise la branche par défaut du dépôt, quelle qu'elle soit.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tests:
    name: Tests de la version
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  archive:
    name: Archive jointe à la Release
    needs: [release-please, tests]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Construire l'archive (même contenu que celle de Composer)
        run: |
          TAG='${{ needs.release-please.outputs.tag_name }}'
          git archive --format=zip --prefix="babel-moteur-${TAG}/" -o "babel-moteur-${TAG}.zip" "$TAG"
          unzip -l "babel-moteur-${TAG}.zip"

      - name: Joindre l'archive à la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ needs.release-please.outputs.tag_name }}' "babel-moteur-${{ needs.release-please.outputs.tag_name }}.zip" --clobber

  packagist:
    name: Notifier Packagist
    needs: [release-please, tests]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Demander la mise à jour du paquet
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::notice::Secrets PACKAGIST_USERNAME / PACKAGIST_TOKEN absents : la mise à jour repose sur l'intégration GitHub de Packagist (voir MAINTENANCE.md)."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":"https://packagist.org/packages/but-mmi-beziers/babel-moteur"}'
